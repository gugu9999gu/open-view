name: One-time runtime source import
on:
  push:
    branches: [feat/runtime-tracing-20261029]
    paths: [scripts/finalize-runtime-import.py]
permissions:
  contents: write
  actions: read
jobs:
  import:
    if: github.repository == 'gugu9999gu/open-view' && github.ref == 'refs/heads/feat/runtime-tracing-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Retrieve the previously reviewed dependency artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 40831620396 --repo "$GITHUB_REPOSITORY" --name runtime-dependency-lock --dir /tmp/runtime-deps
      - name: Import only hash-verified files and remove this importer
        run: python scripts/finalize-runtime-import.py
      - name: Commit to the feature branch only, without force
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: finalize hash-verified runtime source and locked dependencies'
          git push origin HEAD:refs/heads/feat/runtime-tracing-20261029
