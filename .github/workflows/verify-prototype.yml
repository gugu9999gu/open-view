name: Verify Open View prototype
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: open-view-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEERNESS_OFFLINE: '1'
      LEERNESS_NO_PATH_CHECK: '1'
      LEERNESS_NO_STALE_CHECK: '1'
      LEERNESS_NO_DRIFT_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt
      - name: Install locked Node dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check source syntax and encoding
        run: npm run check
      - name: Node unit and real HTTP integration tests
        run: |
          mkdir -p artifacts
          npm test | tee artifacts/node-tests.txt
      - name: Verify leerness harness
        run: npm run harness:verify
      - name: Install pinned browser test tools
        run: |
          python -m pip install -r scripts/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Real browser to server E2E
        run: npm run test:e2e
      - name: Ensure verification did not rewrite tracked source
        run: git diff --exit-code
      - name: Archive tracked source
        if: success()
        run: git archive --format=zip --prefix=open-view/ -o artifacts/open-view-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-view-verification
          path: artifacts/
          retention-days: 14
